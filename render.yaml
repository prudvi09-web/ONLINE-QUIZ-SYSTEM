services:
  # Unified Full-Stack Online Quiz System (React + Spring Boot)
  - type: web
    name: online-quiz-system
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: PORT
        value: 8080
      - key: JAVA_TOOL_OPTIONS
        value: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -Xss512k"
