services:
  # Backend Spring Boot Web Service
  - type: web
    name: quiz-system-backend
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: PORT
        value: 10000

  # Frontend React Static Site
  - type: static
    name: quiz-system-frontend
    rootDir: frontend
    buildCommand: npm install && npm run build
    publishDir: dist
    plan: free
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: quiz-system-backend
          property: url
